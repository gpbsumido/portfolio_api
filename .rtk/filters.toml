# Project-local RTK filters. These take precedence over the user-global ones.
schema_version = 1

# rtk's built-in vitest summariser collapses a run to "PASS (n) FAIL (n)", and
# that count only reflects individual assertions. A suite that fails to LOAD --
# a bad vi.mock factory, an import error -- reports zero failed tests while
# vitest itself exits 1, so the summary reads green on a broken run.
# Test output is the one place a wrong summary is worse than a long one.
[filters.vitest]
description = "Pass vitest output through instead of summarising it"
match_command = "vitest"
strip_ansi = true
max_lines = 400
